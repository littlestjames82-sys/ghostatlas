[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostatlas"
version = "0.1.0"
description = "Human codebase map built on GhostSlice: visual module map, start-here reading order, and architecture brief"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["codebase", "onboarding", "architecture", "ghostslice", "visualisation"]
dependencies = []

[project.scripts]
ghostatlas = "ghostatlas.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
